<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Temporizador de Foco (React)</title>
        
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Babel para transpilar JSX no navegador -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Bibliotecas de áudio e PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!-- Fontes -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

        <style>
            body {
                font-family: 'Inter', sans-serif;
            }

            @keyframes screenFlash {
                0% {
                    background-color: #111827;
                }

                50% {
                    background-color: #4f46e5;
                }

                100% {
                    background-color: #111827;
                }
            }

            .flash-animation {
                animation: screenFlash 0.5s ease-in-out;
            }

            .task-completed span {
                text-decoration: line-through;
                color: #6b7280;
            }
        </style>
        </head>

    <body class="bg-gray-900 text-white min-h-screen flex items-center justify-center transition-colors duration-300 overflow-x-hidden">

        <div id="root"></div>

        <script type="text/babel">
            const { useState, useEffect, useCallback } = React;

            // --- Componente de Notificação (Toast) ---
            const Toast = ({ message, show }) => {
                return (
                    <div className={`fixed top-5 right-5 bg-red-600 text-white py-3 px-5 rounded-xl shadow-lg transform transition-transform duration-500 ease-in-out z-50 ${show ? 'translate-x-0' : 'translate-x-[120%]'}`}>
                        <p>{message}</p>
                    </div>
                );
            };

                // --- Componente da Lista de Tarefas ---
                const TaskList = ({ tasks, onRemove, onStart, onDownload }) => {
                    const hasTasks = tasks.length > 0;

                return (
                    <div className={`w-full md:w-1/3`}>
                        <div className="bg-gray-800 p-6 rounded-xl shadow-lg h-full flex flex-col">
                            <h2 className="text-xl font-semibold mb-4 text-gray-300">Sua Lista de Foco</h2>
                            <ul className="space-y-3 flex-grow">
                                {tasks.map((task, index) => (
                                    <li key={index} className={`bg-gray-700 p-3 rounded-lg flex justify-between items-center transition-colors duration-300 ${task.isCurrent ? 'bg-indigo-600 text-white font-bold' : ''} ${task.completed ? 'task-completed' : ''}`}>
                                        <span>{task.name} - {task.duration} min</span>
                                        <button onClick={() => onRemove(index)} className="text-red-400 hover:text-red-600 font-bold text-xl">&times;</button>
                                    </li>
                                ))}
                            </ul>
                            {hasTasks && (
                                <>
                                    <button onClick={onStart} className="mt-6 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105 shadow-lg text-lg">
                                        Concluir e Iniciar
                                    </button>
                                    <div className="mt-4 flex flex-col sm:flex-row gap-2">
                                        <button onClick={() => onDownload('json')} className="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition">Baixar JSON</button>
                                        <button onClick={() => onDownload('pdf')} className="w-full bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition">Baixar PDF</button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                );
            };

                // --- Componente Principal da Aplicação ---
                function App() {
                    const [tasks, setTasks] = useState([]);
                    const [view, setView] = useState('input'); // 'input', 'timer', 'summary'
                    const [currentTaskIndex, setCurrentTaskIndex] = useState(null);
                    const [timerSeconds, setTimerSeconds] = useState(0);
                    const [isPaused, setIsPaused] = useState(false);
                    const [toast, setToast] = useState({ show: false, message: '' });

                const [synth, setSynth] = useState(null);

                // Função para formatar o tempo
                const formatTime = useCallback((seconds, showSign = true) => {
                    const isNegative = seconds < 0;
                    const absSeconds = Math.abs(seconds);
                    const mins = Math.floor(absSeconds / 60);
                    const secs = absSeconds % 60;
                    const sign = showSign && isNegative ? '-' : '';
                    return `${sign}${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }, []);

                // Efeito para o temporizador
                useEffect(() => {
                    if (view !== 'timer' || isPaused || currentTaskIndex === null) {
                        return;
                    }

                    const interval = setInterval(() => {
                        setTimerSeconds(prev => prev - 1);
                    }, 1000);

                    return () => clearInterval(interval);
                }, [view, isPaused, currentTaskIndex]);

                // Efeito para o alerta sonoro e visual
                useEffect(() => {
                    if (timerSeconds === -1) {
                        if (synth) synth.triggerAttackRelease("C5", "0.5s");
                        document.body.classList.add('flash-animation');
                        setTimeout(() => document.body.classList.remove('flash-animation'), 500);
                    }
                }, [timerSeconds, synth]);

                // Função para mostrar notificação
                const showToast = (message) => {
                    setToast({ show: true, message });
                    setTimeout(() => setToast({ show: false, message: '' }), 3000);
                };

                const handleAddTask = (name, duration) => {
                    if (name && duration > 0) {
                        setTasks([...tasks, { name, duration, completed: false, startTime: null, actualDuration: null, isCurrent: false }]);
                    } else {
                        showToast('Por favor, insira um nome e uma duração válida.');
                    }
                };

                const handleRemoveTask = (index) => {
                    setTasks(tasks.filter((_, i) => i !== index));
                };

                const startFocusSession = async () => {
                    if (tasks.length === 0) {
                        showToast('Adicione pelo menos uma tarefa para começar.');
                        return;
                    }
                    try {
                        await Tone.start();
                        setSynth(new Tone.Synth().toDestination());

                        const firstUncompletedIndex = tasks.findIndex(t => !t.completed);
                        if (firstUncompletedIndex !== -1) {
                            setCurrentTaskIndex(firstUncompletedIndex);
                            setView('timer');
                        } else {
                            showToast("Todas as tarefas já foram concluídas!");
                        }
                    } catch (e) {
                        showToast("Erro ao iniciar o áudio.");
                    }
                };

                // [FIXED] Efeito para atualizar a tarefa atual e o tempo quando o índice muda.
                // Adicionado `tasks` ao array de dependências e uma condição para evitar loops infinitos.
                useEffect(() => {
                    if (currentTaskIndex !== null && tasks[currentTaskIndex]) {
                        const task = tasks[currentTaskIndex];

                        // A condição `!task.isCurrent` previne o loop. O `setTasks` só roda
                        // se o estado atual não refletir que esta é a tarefa corrente.
                        if (!task.isCurrent) {
                            setTasks(prevTasks => prevTasks.map((t, i) => ({
                                ...t,
                                isCurrent: i === currentTaskIndex,
                                startTime: i === currentTaskIndex && !t.startTime ? Date.now() : t.startTime,
                            })));
                        }

                        setTimerSeconds(task.duration * 60);
                        setIsPaused(false);
                    }
                }, [currentTaskIndex, tasks]);


                const handleNextTask = (markCompleted) => {
                    if (currentTaskIndex === null) return;

                    let updatedTasks = [...tasks];

                    if (markCompleted) {
                        const currentTask = updatedTasks[currentTaskIndex];
                        if (currentTask && !currentTask.completed) {
                            updatedTasks[currentTaskIndex] = {
                                ...currentTask,
                                actualDuration: Math.round((Date.now() - currentTask.startTime) / 1000),
                                completed: true
                            };
                        }
                    }

                    // É importante chamar setTasks aqui para que a próxima lógica use o estado atualizado
                    setTasks(updatedTasks);

                    const nextIndex = updatedTasks.findIndex((task, index) => index > currentTaskIndex && !task.completed);

                    if (nextIndex !== -1) {
                        setCurrentTaskIndex(nextIndex);
                    } else {
                        if (updatedTasks.every(t => t.completed)) {
                            setView('summary');
                        } else {
                            showToast("Não há mais tarefas pendentes à frente.");
                        }
                    }
                };

                const handlePrevTask = () => {
                    let prevIndex = -1;
                    for (let i = currentTaskIndex - 1; i >= 0; i--) {
                        if (!tasks[i].completed) {
                            prevIndex = i;
                            break;
                        }
                    }
                    if (prevIndex !== -1) {
                        setCurrentTaskIndex(prevIndex);
                    } else {
                        showToast("Nenhuma tarefa anterior pendente.");
                    }
                };

                const handleEditList = () => {
                    setView('input');
                    setCurrentTaskIndex(null);
                    setTasks(tasks.map(t => ({ ...t, isCurrent: false })));
                };

                const handleReset = () => {
                    setTasks([]);
                    setView('input');
                    setCurrentTaskIndex(null);
                };

                const handleDownload = (format) => {
                    const date = new Date().toLocaleDateString('pt-BR');
                    if (format === 'json') {
                        const data = {
                            data: date,
                            tarefas: tasks.map(t => ({
                                tarefa: t.name,
                                tempo_estimado_min: t.duration,
                                tempo_real: t.actualDuration ? formatTime(t.actualDuration, false) : 'N/A',
                                concluida: t.completed
                            }))
                        };
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
                        const a = document.createElement('a');
                        a.href = dataStr;
                        a.download = `tarefas_${date.replace(/\//g, '-')}.json`;
                        a.click();
                    } else if (format === 'pdf') {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        doc.text(`Relatório de Tarefas - ${date}`, 14, 16);
                        const tableColumn = ["Tarefa", "Estimado (min)", "Real", "Status"];
                        const tableRows = tasks.map(t => [
                            t.name,
                            t.duration,
                            t.actualDuration ? formatTime(t.actualDuration, false) : 'N/A',
                            t.completed ? 'Concluída' : 'Pendente'
                        ]);
                        doc.autoTable({ head: [tableColumn], body: tableRows, startY: 20 });
                        const totalEstimated = tasks.reduce((acc, t) => acc + t.duration * 60, 0);
                        const totalActual = tasks.reduce((acc, t) => acc + (t.actualDuration || 0), 0);
                        const finalY = doc.lastAutoTable.finalY || 20;
                        doc.text(`Total Estimado: ${formatTime(totalEstimated, false)}`, 14, finalY + 10);
                        doc.text(`Total Real: ${formatTime(totalActual, false)}`, 14, finalY + 17);
                        doc.save(`tarefas_${date.replace(/\//g, '-')}.pdf`);
                    }
                };

                // Renderização condicional da view principal
                const renderMainView = () => {
                    const currentTask = currentTaskIndex !== null ? tasks[currentTaskIndex] : null;

                    switch (view) {
                        case 'timer':
                            return (
                                <div className="w-full h-[50vh] md:h-full flex flex-col items-center justify-center text-center p-8 bg-gray-800 rounded-2xl shadow-2xl min-h-[300px]">
                                    <h2 className="text-2xl md:text-4xl font-bold text-indigo-300 mb-4">{currentTask?.name}</h2>
                                    <h1 className={`text-7xl md:text-9xl font-black tracking-tighter ${timerSeconds < 0 ? 'text-red-500' : 'text-white'}`}>{formatTime(timerSeconds)}</h1>
                                    <div className="mt-8 flex flex-wrap justify-center gap-4">
                                        <button onClick={() => setIsPaused(!isPaused)} className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-lg">{isPaused ? 'Continuar' : 'Pausar'}</button>
                                        <button onClick={handlePrevTask} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg">Anterior</button>
                                        <button onClick={() => handleNextTask(false)} className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg">Pular</button>
                                        <button onClick={() => handleNextTask(true)} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg">Concluir</button>
                                        <button onClick={handleEditList} className="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg mt-4 sm:mt-0">Editar Lista</button>
                                    </div>
                                </div>
                            );
                        case 'summary':
                            const totalEstimated = tasks.reduce((acc, t) => acc + t.duration * 60, 0);
                            const totalActual = tasks.reduce((acc, t) => acc + (t.actualDuration || 0), 0);
                            return (
                                <div className="w-full h-[50vh] md:h-full flex flex-col items-center justify-center text-center p-8 bg-gray-800 rounded-2xl shadow-2xl min-h-[300px]">
                                    <h2 className="text-3xl md:text-4xl font-bold text-green-400 mb-6">Parabéns, você concluiu!</h2>
                                    <div className="space-y-4 text-lg">
                                        <p>Tempo total estimado: <span className="font-bold text-xl text-indigo-300">{formatTime(totalEstimated, false)}</span></p>
                                        <p>Tempo total real: <span className="font-bold text-xl text-indigo-300">{formatTime(totalActual, false)}</span></p>
                                    </div>
                                    <button onClick={handleReset} className="mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg">Criar Nova Lista</button>
                                </div>
                            );
                        case 'input':
                        default:
                            const InputView = () => {
                                const [name, setName] = useState('');
                                const [duration, setDuration] = useState('');
                                const handleSubmit = (e) => {
                                    e.preventDefault();
                                    handleAddTask(name, parseInt(duration));
                                    setName('');
                                    setDuration('');
                                };
                                return (
                                    <div className="bg-gray-800 p-6 rounded-xl shadow-lg">
                                        <h2 className="text-xl font-semibold mb-4 text-gray-300">Adicionar Nova Tarefa</h2>
                                        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-4">
                                            <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Nome da tarefa..." className="flex-grow bg-gray-700 text-white placeholder-gray-400 border-2 border-gray-600 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                            <input type="number" value={duration} onChange={e => setDuration(e.target.value)} placeholder="Duração (min)" min="1" className="w-full sm:w-32 bg-gray-700 text-white placeholder-gray-400 border-2 border-gray-600 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                            <button type="submit" className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg">Adicionar</button>
                                        </form>
                                    </div>
                                );
                            };
                            return <InputView />;
                    }
                };

                return (
                    <>
                        <Toast message={toast.message} show={toast.show} />
                        <div className="w-full max-w-6xl mx-auto p-4 md:p-8">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl md:text-4xl font-bold text-indigo-400">Temporizador de Foco</h1>
                                <p className="text-gray-400 mt-2">Concentre-se em uma tarefa de cada vez.</p>
                            </div>
                            <div className="flex flex-col md:flex-row gap-8">
                                <TaskList tasks={tasks} onRemove={handleRemoveTask} onStart={startFocusSession} onDownload={handleDownload} />
                                <div className="w-full md:w-2/3">
                                    {renderMainView()}
                                </div>
                            </div>
                        </div>
                    </>
                );
            }

                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App />);
</script>

    </body>

</html>
